<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("drift-theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="Drift — anonymous one-to-one random video and text chat. Real WebRTC, real strangers, no recordings."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6A3D'/%3E%3Cpath d='M8 16a8 8 0 0 1 8-8 8 8 0 0 1 6.9 4' stroke='%230B1017' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Cpath d='M24 16a8 8 0 0 1-8 8 8 8 0 0 1-6.9-4' stroke='%230B1017' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Drift — Meet New People Around the World</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
